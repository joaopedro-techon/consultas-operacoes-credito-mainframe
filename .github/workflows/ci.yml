name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA do commit (a tag pode ser movida); a versão fica no comentário
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Contrato HTTP (ADR-0017): openapi.yaml e catalogo-campos.yml da main de consultas-operacoes-credito. Os
      # testes de conformidade (Contrato*) usam a versão baixada, não a cópia versionada em src/test/resources
      - name: Contrato da visão consolidada
        run: |
          ./scripts/baixar-contrato.sh target/contrato
          for arquivo in openapi.yaml catalogo-campos.yml; do
            if ! cmp -s "target/contrato/$arquivo" "src/test/resources/contrato/$arquivo"; then
              echo "::warning file=src/test/resources/contrato/$arquivo::Cópia versionada diferente da main de consultas-operacoes-credito; atualize com scripts/baixar-contrato.sh"
            fi
          done
      # Testes HTTP de caixa-preta sobem WireMock, Valkey e LocalStack (SQS) com Testcontainers (Docker do runner)
      - name: Build e testes
        run: ./mvnw -B verify -Dcontrato.dir=target/contrato
      - name: docker-compose e Collector válidos
        run: |
          docker compose config -q
          docker run --rm -v "$PWD/observabilidade/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.165.0 validate --config=/etc/otelcol-contrib/config.yaml
      - name: Imagem Docker
        run: docker build -t consultas-operacoes-credito-mainframe:${{ github.sha }} .

  # Terraform do serviço ECS (infra/ecs): formatação e validação sem backend nem credenciais. O API Gateway
  # (infra/api-gateway) fica no repositório da visão consolidada (ADR-0017)
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diretorio: [infra/ecs]
    defaults:
      run:
        working-directory: ${{ matrix.diretorio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
