# Override do docker-compose para medir a capacidade de UMA task (carga/README.md).
# Uso (na raiz do repositório):
#   $env:APP_CPUS="1"; $env:APP_MEMORIA="2g"; docker compose -f docker-compose.yml -f carga/docker-compose.carga.yml up -d --build
# Os limites imitam a task Fargate da fonte primária: 1 vCPU / 2 GB.
services:
  app:
    # Limite de CPU e memória do container (equivalente a docker run --cpus/--memory). A JVM enxerga esses
    # limites (ActiveProcessorCount e MaxRAMPercentage=75 do Dockerfile), como no Fargate.
    cpus: ${APP_CPUS:-1}
    mem_limit: ${APP_MEMORIA:-2g}
    # Para não disputar núcleos com LocalStack, Valkey, WireMock e o k6, fixe-os depois do up:
    #   docker update --cpuset-cpus 0 consultas-operacoes-credito-mainframe-app-1
    environment:
      # Medindo uma task da fonte primária com a cota inteira: MAX_TASKS=1 dá 1.500 chamadas/s a esta task
      CONSULTAS_FONTE_PRIMARIA_COTA_CHAMADAS_POR_SEGUNDO: ${CONSULTAS_FONTE_PRIMARIA_COTA_CHAMADAS_POR_SEGUNDO:-1500}
      CONSULTAS_FONTE_PRIMARIA_COTA_MAX_TASKS: ${CONSULTAS_FONTE_PRIMARIA_COTA_MAX_TASKS:-3}
      # false mede o pior caso do cache de custódia (toda consulta OPERACAO refaz a descoberta nas 4 custódias)
      CONSULTAS_CACHE_HABILITADO: ${CONSULTAS_CACHE_HABILITADO:-true}

  wiremock:
    # Respostas com atraso (latência do mainframe) sem prender uma thread do Jetty por requisição;
    # sem isto o WireMock vira o gargalo antes da aplicação
    command:
      - --disable-banner
      - --async-response-enabled=true
      - --async-response-threads=400
      - --container-threads=400
      - --no-request-journal
